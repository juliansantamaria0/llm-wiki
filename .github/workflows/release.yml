name: Release packages
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev,pdf]"
      - name: Check tag matches version
        run: python -c "import os, llm_wiki; assert os.environ['GITHUB_REF_NAME'] == 'v' + llm_wiki.__version__"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: dist/*
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: dist
      - name: Attach distributions to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --title "$TAG" --generate-notes
